name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dast_target:
        description: 'Deployed environment URL to DAST-scan (e.g. https://staging.example.com). The scan runs only when this is provided.'
        required: false
        default: ''

jobs:
  docs:
    name: Contributor Docs (command drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Asserts every lint/test/build entry point documented in
      # docs/getting-started.md §7 still exists. No toolchains needed — this only
      # checks that the commands the doc names are still declared.
      - run: node scripts/check-documented-commands.js

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-install
        with:
          working-directory: frontend
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-install
        with:
          working-directory: frontend
      - run: npx playwright install chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-install
        with:
          working-directory: backend
      - run: npm run lint
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-lcov
          path: backend/coverage/lcov.info
          retention-days: 7

  contracts:
    name: Soroban Contracts (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/**/Cargo.lock') }}
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown --release

  scheduler:
    name: Go Scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: scheduler/go.sum
      - name: Verify gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt formatting violations found:"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build -v ./...

  zap_scan:
    name: DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve DAST scan target
        id: resolve_target
        run: |
          if [ -n "$DAST_TARGET" ]; then
            echo "target=$DAST_TARGET" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No DAST target provided. Pass dast_target via workflow_dispatch (or wire up a real environment URL) to run the ZAP baseline scan."
          fi
        env:
          DAST_TARGET: ${{ inputs.dast_target }}

      - name: Run ZAP Baseline Scan
        id: zap_scan
        if: steps.resolve_target.outputs.enabled == 'true'
        # Scan failures against the live target are a precondition/tooling
        # outcome, not a code defect, so they must not fail the whole build.
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ steps.resolve_target.outputs.target }}
          cmd_options: '-J report.json'
          fail_action: false

      - name: Run Security Triage Script
        if: steps.resolve_target.outputs.enabled == 'true' && steps.zap_scan.outcome == 'success'
        run: node scripts/triage-zap.js

      - name: Teardown Ephemeral Staging Stack
        if: always()
        run: docker compose down -v

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report.json
          retention-days: 14
          if-no-files-found: warn

  container_build_scan:
    name: Container Build, Scan & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greenpay-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: greenpay-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: greenpay-scheduler
            context: ./scheduler
            dockerfile: ./scheduler/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and load image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivyignore:/.trivyignore" \
            aquasec/trivy:latest image \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --pkg-types os,library \
            --ignorefile /.trivyignore \
            --format json \
            ${{ matrix.image }}:local-scan | tee /tmp/trivy-${{ matrix.image }}.json

      - name: Check for unignored vulnerabilities
        run: |
          # Parse the JSON output to find unignored HIGH/CRITICAL vulnerabilities
          VULN_COUNT=$(jq '[.Results[]?.Misconfigurations[]? + .Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' /tmp/trivy-${{ matrix.image }}.json || echo 0)
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "Found $VULN_COUNT unignored HIGH/CRITICAL vulnerabilities in ${{ matrix.image }}:"
            jq '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH") | {VulnerabilityID, Severity, Title}' /tmp/trivy-${{ matrix.image }}.json
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
